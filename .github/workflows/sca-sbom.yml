name: SCA and SBOM Analysis

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 1. SBOM (Syft) ---
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.json

      - name: Upload SBOM JSON
        uses: actions/upload-artifact@v7
        with:
          name: sbom-json
          path: sbom.json

      # --- 2. SCA (Trivy) ---
      # Игнорируем pom.xml, чтобы не было ошибки 429 от Maven Central
      - name: Run Trivy (JSON output)
        run: |
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy fs --scanners vuln --format json --output trivy-results.json --skip-files "**/pom.xml" --skip-dirs "target" . || true

      - name: Upload Trivy JSON
        uses: actions/upload-artifact@v7
        with:
          name: trivy-json
          path: trivy-results.json

      # --- 3. SCA (Grype) ---
      - name: Run Grype (JSON output)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
          grype dir:. -o json > grype-results.json || true

      - name: Upload Grype JSON
        uses: actions/upload-artifact@v7
        with:
          name: grype-json
          path: grype-results.json

      # --- 4. SCA (OSV-Scanner) ---
      - name: Run OSV-Scanner (JSON output)
        run: |
          curl -sSfL https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64 -o /usr/local/bin/osv-scanner
          chmod +x /usr/local/bin/osv-scanner
          osv-scanner -r --format json --output osv-results.json ./ || true

      - name: Upload OSV JSON
        uses: actions/upload-artifact@v7
        with:
          name: osv-json
          path: osv-results.json
